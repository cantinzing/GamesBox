name: CI

on:
  push:
    branches: [main, opensource]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ==========================================================================
      # 注意（踩过）：run: 块内【禁止出现任何非 ASCII 字符】（含中文注释/报错文案）。
      #   GitHub Actions 把 run: 块写成临时 .ps1 时不写 BOM，而 Windows
      #   PowerShell 5.1 在没有 BOM 时按 ANSI 代码页解析文件 —— 中文会被读成乱码，
      #   轻则输出乱码，重则字符串引号/花括号配对失败，脚本在【解析阶段】直接崩，
      #   命令一行都不会执行（曾因此让整个 CI 红在第一步）。
      #   所以：run: 块一律纯英文 ASCII；中文只写在 YAML 注释里（注释不进入脚本）。
      # ==========================================================================

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "git clone vcpkg failed, exit code $LASTEXITCODE" }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed, exit code $LASTEXITCODE" }

      - name: Restore vcpkg dependencies
        shell: powershell
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed, exit code $LASTEXITCODE" }

      # ⚠️ 重要陷阱：这里的构建器是原生(exe) 命令，而 PowerShell 默认【不会】因为原生
      #    进程返回非零退出码就把这一步判为失败。历史上正是这个原因，让"便携构建失败"
      #    被悄悄吞掉：CI 继续拿上一次 MSIX 构建残留的 exe（AppxPackage=true，
      #    不链接引导库、也不拷贝 Bootstrap.dll）去加壳、去打包，最终产出一个
      #    “CI 全绿、下载后双击无反应”的包。
      #    所以每一次构建调用之后都必须显式检查 $LASTEXITCODE，否则等于没有断言。
      - name: Restore NuGet packages
        shell: powershell
        run: |
          msbuild GameLibrary.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed, exit code $LASTEXITCODE" }

      # ============================================================================
      # 部署模式（务必区分，且每一步都显式传参，不依赖 vcxproj 默认值，保证 CI 行为确定）
      #
      #   便携版 / setup.exe  ->  自包含  (WindowsAppSDKSelfContained=true)
      #       运行时随应用一起分发，目标机器【无需安装任何运行时】，解压/安装即可运行。
      #
      #   两个 MSIX 产物        ->  框架依赖 (WindowsAppSDKSelfContained=false)
      #       走 WindowsAppSDK 框架包，体积小。不要与自包含混用同一份输出。
      #
      # 三个构建共用同一个 OutDir，因此顺序至关重要：
      #   自包含构建排在最后，保证 zip / setup.exe 拿到的是自包含产物。
      # ============================================================================

      # 1) Sideload MSIX (self-signed; for manual sideload install) —— 框架依赖
      - name: Build sideload MSIX
        shell: powershell
        run: |
          msbuild src\GameLibrary.Package\GameLibrary.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxBundlePlatforms=x64 /p:WindowsAppSDKSelfContained=false "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages" /m
          if ($LASTEXITCODE -ne 0) { throw "Sideload MSIX build failed, exit code $LASTEXITCODE" }

      # 2) Store bundle (unsigned .msixbundle for Microsoft Partner Center; Store re-signs it) —— 框架依赖
      - name: Build store bundle
        shell: powershell
        run: |
          msbuild src\GameLibrary.Package\GameLibrary.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:WindowsAppSDKSelfContained=false /p:AppxPackageSigningEnabled=false "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\StorePackages" /m
          if ($LASTEXITCODE -ne 0) { throw "Store bundle build failed, exit code $LASTEXITCODE" }

      # 发布前自检（MSIX 侧）：确认调试符号没有混进包里。
      # 这一道是【硬断言】。注意历史：这里原先写着"77 MB 的 GameLibrary.pdb 混进包，
      # 把 MSIX 从 45 MB 撑到 122 MB"—— 那个归因是【错的】，实测已推翻：
      #   * 应用包本体一直只有 ~1.7 MB（26 个条目，最大的是 GameLibrary.exe 1.7 MB）；
      #   * pdb 确实会被复制到 wapproj 的中间目录 bin\...\GameLibrary.pdb，但从未进入
      #     .msix —— 修复前后 artifact 体积逐字节相同（122.1 MB）就是证据；
      #   * 那 122 MB 的真身是 wapproj 的 SideloadOnly 构建为 x64/win32/x86/ARM/ARM64
      #     五种架构各暂存的一份 WindowsAppRuntime + VCLibs（约 118 MB），见下方
      #     "Prune appx dependencies" 步骤。
      # 断言本身仍然有价值（它证明"包里没有调试符号"这个事实），所以保留。
      # 便携 zip 之所以不受影响，是因为打包脚本里另外显式删掉了 *.pdb/*.ilk。
      - name: Verify MSIX payload (no debug symbols)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $pkgs = @()
          foreach ($dir in @("$env:GITHUB_WORKSPACE\AppPackages", "$env:GITHUB_WORKSPACE\StorePackages")) {
            if (Test-Path $dir) { $pkgs += Get-ChildItem $dir -Recurse -File -Include *.msix, *.msixbundle }
          }
          if ($pkgs.Count -eq 0) { throw "No .msix/.msixbundle was produced under AppPackages / StorePackages" }

          $errors = @()
          foreach ($pkg in $pkgs) {
            Write-Host ("Checking {0} ({1:N1} MB)" -f $pkg.Name, ($pkg.Length / 1MB))
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try {
              $entries = $zip.Entries

              # Definitive signal: the linker's ProgramDatabaseFile (.pdb) and the
              # incremental-link leftovers must never be in the package.
              $bad = @($entries | Where-Object { $_.FullName -match '\.(pdb|ilk|ipdb|iobj|exp)$' })
              foreach ($b in $bad) {
                $errors += ("{0}: contains debug file '{1}' ({2:N1} MB)" -f $pkg.Name, $b.FullName, ($b.Length / 1MB))
              }

              # A .msixbundle is a container of .msix files, so its own entry list is
              # just inner packages - do not run the payload-level checks on it.
              if ($pkg.Extension -eq '.msix') {
                $totalMB = [math]::Round((($entries | Measure-Object Length -Sum).Sum) / 1MB, 1)
                Write-Host ("  payload: {0} entries, {1} MB uncompressed" -f $entries.Count, $totalMB)
                # Size is a symptom, not a root cause; warn instead of failing on a
                # threshold we cannot pin exactly ahead of time.
                if ($totalMB -gt 64) {
                  Write-Host ("::warning::{0}: uncompressed payload is {1} MB - the app package is expected to stay small" -f $pkg.Name, $totalMB)
                }
                if (-not ($entries | Where-Object { $_.FullName -eq 'resources.pri' })) {
                  $errors += ("{0}: resources.pri is missing from the package (WinUI cannot resolve themeresources)" -f $pkg.Name)
                }
                foreach ($e in ($entries | Sort-Object Length -Descending | Select-Object -First 8)) {
                  Write-Host ("    {0,12:N0}  {1}" -f $e.Length, $e.FullName)
                }
              }
            } finally {
              $zip.Dispose()
            }
          }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            throw "MSIX payload verification failed"
          }
          Write-Host "MSIX payload verification passed: no debug symbols; resources.pri present."

      # 发布前自检（打包布局）：把 AppPackages / StorePackages 里暂存的依赖包裁到
      # 【受支持的架构】。这是 122 MB 问题的真正修法。
      # 机制：wapproj 的 SideloadOnly 构建会为 x64 / win32 / x86 / ARM / ARM64
      # 各暂存一份 Microsoft.WindowsAppRuntime.1.7.msix 与 Microsoft.VCLibs（合计
      # 约 118 MB），供"任意架构的机器离线侧载"。而本应用只出 x64
      # （Platform=x64、/MACHINE:X64、包名 _x64），x86/ARM/ARM64 那三份永远装不上，
      # 只会把 artifact 从 ~32 MB 撑到 ~122 MB。
      # 使用显式裁剪而不是只依赖 AppxBundlePlatforms：后者是"请求 MSBuild 别这么做"，
      # 前者是"结果无论如何都只有 x64"，并且自带事后断言，不靠猜。
      - name: Prune appx dependencies to x64
        shell: powershell
        run: |
          $keep = 'x64'
          $roots = @("$env:GITHUB_WORKSPACE\AppPackages", "$env:GITHUB_WORKSPACE\StorePackages")
          $pruned = 0
          $kept = 0
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $deps = @(Get-ChildItem $root -Recurse -Directory -Filter 'Dependencies' -ErrorAction SilentlyContinue)
            foreach ($dep in $deps) {
              foreach ($arch in (Get-ChildItem $dep.FullName -Directory)) {
                if ($arch.Name -ieq $keep) { $kept++; continue }
                $mb = [math]::Round(((Get-ChildItem $arch.FullName -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
                Write-Host ("prune: {0} ({1} MB)" -f $arch.FullName, $mb)
                Remove-Item $arch.FullName -Recurse -Force
                $pruned++
              }
            }
          }
          if ($kept -eq 0) { throw "No x64 dependency folder found; the packaging layout changed and this step would be blind" }
          Write-Host ("pruned {0} unsupported-arch dependency folders, kept {1} x64 folder(s)" -f $pruned, $kept)

          # Post-condition: nothing but x64 may remain. Fail loudly otherwise, so a
          # future MSBuild change cannot silently re-inflate the artifacts.
          $stray = @()
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            foreach ($dep in (Get-ChildItem $root -Recurse -Directory -Filter 'Dependencies' -ErrorAction SilentlyContinue)) {
              $stray += @(Get-ChildItem $dep.FullName -Directory | Where-Object { $_.Name -ine 'x64' })
            }
          }
          if ($stray.Count -gt 0) {
            $stray | ForEach-Object { Write-Host ("::error::unsupported dependency folder still present: {0}" -f $_.FullName) }
            throw "Dependency pruning failed"
          }

          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $mb = [math]::Round(((Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
            Write-Host ("staged output {0}: {1} MB" -f $root, $mb)
            if ($mb -gt 64) { Write-Host ("::warning::{0} is still {1} MB after pruning" -f $root, $mb) }
          }

      # 3) 便携版 / setup.exe 的来源：【自包含】构建。
      #    必须排在两个 MSIX 构建【之后】—— 三者共用同一个 OutDir，
      #    自包含构建(/t:Rebuild)最后执行，保证被打包的就是自包含产物。
      - name: Build portable (self-contained)
        shell: powershell
        run: |
          msbuild src\GameLibrary\GameLibrary.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VcpkgRoot=$env:VCPKG_ROOT /p:WindowsAppSDKSelfContained=true /t:Rebuild /m
          if ($LASTEXITCODE -ne 0) { throw "Portable (self-contained) build failed, exit code $LASTEXITCODE" }

      # 发布前自检：把「双击没反应」这类问题拦在 CI 里，而不是让用户下载后才踩坑。
      # 本步骤【模式感知】：自包含与框架依赖所需的文件不同，不能一刀切。
      - name: Verify portable payload
        shell: powershell
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\src\GameLibrary\x64\Release\GameLibrary"
          $exe      = Join-Path $buildDir "GameLibrary.exe"
          $errors   = @()
          $warnings = @()

          Write-Host "Checking build dir: $buildDir"
          if (-not (Test-Path $buildDir)) {
            throw "Build output directory does not exist: $buildDir (OutDir probably resolved elsewhere; packing would pick up stale files)"
          }
          Get-ChildItem $buildDir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          if (-not (Test-Path $exe)) {
            $errors += "GameLibrary.exe is missing"
          } else {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))

            # CORRECTED (was a landmine until 2026-09-11). This block used to add a hard
            # error whenever the exe carried a UPX marker, on the theory that "WinUI 3 /
            # WindowsAppSDK does not support packing". That theory is false. Measured with
            # UPX 5.2.1 --best --lzma on the self-contained, statically-importing exe: the
            # app still starts normally, and UPX preserves the PE import directory, so the
            # WindowsAppRuntime_EnsureIsLoaded assertion below still holds. The real cause
            # of "double-click does nothing" was the missing resources.pri (asserted below),
            # never the packing. Meanwhile this branch sets WindowsAppSdkUndockedReg
            # FreeWinRTInitializeLoadLibrary=false and relies on the static import - which
            # UPX does not disturb.
            #
            # This branch deliberately does NOT pack the exe, so a UPX marker here means an
            # unexpected packing step ran somewhere upstream. That is harmless, so it is a
            # warning, not a failure. Do not turn it back into an error: it would only ever
            # fire on a healthy binary and block the release for no reason.
            if ($text -match 'UPX!') {
              $warnings += "GameLibrary.exe carries a UPX marker but opensource does not pack (harmless: UPX preserves the PE import table; check for an unexpected packing step upstream)"
            }

            # Mode detection: a self-contained build ships the WinUI runtime DLLs.
            $isSelfContained = Test-Path (Join-Path $buildDir 'Microsoft.ui.xaml.dll')

            if ($isSelfContained) {
              Write-Host "Detected SELF-CONTAINED payload: verifying bundled runtime."
              foreach ($f in @(
                  'Microsoft.ui.xaml.dll',
                  'Microsoft.WindowsAppRuntime.dll',
                  'Microsoft.UI.Xaml.Controls.dll',
                  'Microsoft.Windows.ApplicationModel.Resources.dll')) {
                if (-not (Test-Path (Join-Path $buildDir $f))) { $errors += "[self-contained] missing runtime DLL: $f" }
              }
              if (-not (Get-ChildItem $buildDir -Filter '*.pri' -Recurse -ErrorAction SilentlyContinue)) {
                $errors += "[self-contained] no bundled .pri resource files (WinUI control styles depend on them)"
              }

              # resources.pri is MANDATORY for an unpackaged WinUI 3 app, and it is exactly the
              # one file the WindowsAppSDK self-contained targets deliberately do not bring
              # along: Microsoft.WindowsAppSDK.SelfContained.targets deletes the merged
              # resources.pri it unpacks from the runtime MSIX ("each required pri will be
              # copied over separately"), assuming the app's own build produces a resources.pri
              # that merges those framework PRIs.
              #
              # This project used to override _GenerateProjectPriFile to a no-op, so that file
              # never existed. The app then died silently: XAML could not resolve
              # ms-appx:///Microsoft.UI.Xaml/Themes/themeresources.xaml, InitializeComponent
              # threw, and the UnhandledException handler's Handled(true) swallowed it -
              # no window, no dialog, nothing in the event log. That is "double-click does
              # nothing", and it happens on Windows 11 exactly as on Windows 10.
              #
              # Assert on the string "themeresources", not merely on the file existing: that
              # proves the PRI really merged the WinUI framework XAML resources, which is the
              # entire reason the file must be there.
              $pri = Join-Path $buildDir 'resources.pri'
              if (-not (Test-Path $pri)) {
                $errors += "[self-contained] resources.pri is missing from the payload: WinUI cannot resolve its themeresources, so the app starts and immediately dies with no window and no error"
              } else {
                $priLen = (Get-Item $pri).Length
                if ($priLen -lt 100KB) {
                  $errors += "[self-contained] resources.pri is only $priLen bytes - it does not contain the merged WinUI framework resources"
                }
                $priText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($pri))
                if ($priText -notmatch 'themeresources') {
                  $errors += "[self-contained] resources.pri does not reference themeresources (the root resource dictionary of every WinUI control style), so the framework PRIs were not merged in"
                }
              }
              # WindowsAppSdkUndockedRegFreeWinRTInitializeLoadLibrary=false in the vcxproj
              # makes the exe statically import Microsoft.WindowsAppRuntime.dll. That is what
              # turns "runtime cannot be loaded" from a silent exit() (the classic
              # double-click-does-nothing) into a Windows dialog naming the missing module.
              #
              # Assert on the IMPORTED FUNCTION NAME, not on the DLL name: the DLL name also
              # appears inside the exe's embedded WinRT registration manifest, so matching on
              # it alone would pass even with the import gone (false confidence).
              if ($text -notmatch 'WindowsAppRuntime_EnsureIsLoaded') {
                $errors += "[self-contained] GameLibrary.exe carries no WindowsAppRuntime_EnsureIsLoaded reference, so the static import of Microsoft.WindowsAppRuntime.dll is missing (WindowsAppSdkUndockedRegFreeWinRTInitializeLoadLibrary=false is not taking effect) and a broken runtime would fail silently again"
              }
              if ($text -match 'Microsoft\.WindowsAppRuntime\.Bootstrap\.dll') {
                $warnings += "Self-contained payload imports Microsoft.WindowsAppRuntime.Bootstrap.dll (unexpected in self-contained mode)"
              }
            } else {
              Write-Host "Detected FRAMEWORK-DEPENDENT payload: verifying bootstrap chain."
              if ($text -notmatch 'Microsoft\.WindowsAppRuntime\.Bootstrap\.dll') {
                $errors += "Framework-dependent payload does not import Microsoft.WindowsAppRuntime.Bootstrap.dll - an unpackaged app cannot initialize WindowsAppSDK (classic cause of 'double-click does nothing')"
              }
              if (-not (Test-Path (Join-Path $buildDir 'Microsoft.WindowsAppRuntime.Bootstrap.dll'))) {
                $errors += "[framework-dependent] missing Microsoft.WindowsAppRuntime.Bootstrap.dll"
              }
            }
          }

          # Required in both modes: app-private dependencies.
          foreach ($f in @('sqlite3.dll','vcruntime140.dll','msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $buildDir $f))) { $errors += "missing $f" }
          }

          # resources.pri is asserted above (self-contained mode). Do not downgrade that check
          # to a warning: a payload without it looks perfectly healthy - it just never shows
          # a window.

          # Debug junk that must not ship. It is expected to exist in the build dir
          # (the linker writes GameLibrary.pdb there); the question is whether each
          # packaging path strips it. The portable zip strips it explicitly when
          # copying files below, and the MSIX is checked by the dedicated
          # "Verify MSIX payload" step. So here we only warn, to keep the fact visible.
          $junk = Get-ChildItem $buildDir -Include *.pdb, *.ilk -Recurse -ErrorAction SilentlyContinue
          if ($junk) {
            $mb = [math]::Round(($junk | Measure-Object Length -Sum).Sum / 1MB, 1)
            $warnings += "Build dir contains $($junk.Count) debug files ($mb MB total); callers must strip these before shipping (see the portable copy step and the MSIX payload check)"
          }

          $warnings | ForEach-Object { Write-Host "::warning::$_" }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            throw "Portable payload verification failed; packaging and release are blocked"
          }
          Write-Host "Verification passed: payload is complete (checked per self-contained / framework-dependent mode)."

      # 发布前自检（图标）：断言 exe 的 PE 资源段里真的有图标。
      #
      # 为什么值得单独立一道断言：图标资源在这三条链路里【只有一条】会被自动满足。
      #   · MSIX / Store ：磁贴和开始菜单图标来自 Package.appxmanifest -> Assets\*.png，
      #                    所以那条链路从来都是对的，容易让人以为"仓库里有图 = 有图标"。
      #   · 便携 zip     ：直接跑 GameLibrary.exe。
      #   · setup.exe    ：装完跑的是同一个 GameLibrary.exe。
      # 后两条读的是 exe 自身的 RT_GROUP_ICON / RT_ICON 资源 —— 与 Assets\ 里的 PNG
      # 毫无关系。少了 GameLibrary.rc，exe 就是空白图标，而构建、CI、体积全都正常，
      # 没有任何信号。这道断言把这个"静默失败"变成红灯。
      - name: Verify exe icon resource
        shell: powershell
        run: |
          $ws = $env:GITHUB_WORKSPACE
          # The script throws on failure; an uncaught throw fails this step.
          & "$ws\tools\Check-ExeIcon.ps1" -ExePath "$ws\src\GameLibrary\x64\Release\GameLibrary\GameLibrary.exe" -RequireIcoSource "$ws\src\GameLibrary\GameLibrary.ico"

      # 打包便携版 zip。
      # 自包含产物已内置 WindowsAppSDK 运行时，因此【不再】随包附带 MSIX 框架包或
      # 运行时安装脚本 —— 解压即可运行，无需管理员权限。
      - name: Zip portable (self-contained)
        shell: powershell
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\src\GameLibrary\x64\Release\GameLibrary"
          $portableDir = "$env:RUNNER_TEMP\GameLibrary-portable"
          if (-not (Test-Path "$buildDir\GameLibrary.exe")) { throw "GameLibrary.exe was not produced: $buildDir" }

          Remove-Item $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item "$buildDir\*" $portableDir -Recurse -Force
          Get-ChildItem $portableDir -Recurse -File -Include *.pdb, *.ilk, *.exp, *.lib | Remove-Item -Force

          # Ship the self-diagnostic harness inside the zip. When the app refuses to
          # start on a target machine, the user runs Diagnose.bat and sends back
          # Diagnose-Report.txt - no build, no debugger, no guesswork.
          $diag = @("tools\Diagnose.bat", "tools\Diagnose-GameLibrary.ps1")
          foreach ($f in $diag) {
            $src = Join-Path $env:GITHUB_WORKSPACE $f
            if (-not (Test-Path $src)) { throw "diagnostic file missing from the repo: $f" }
            Copy-Item $src $portableDir -Force
          }

          # Bilingual usage note ships with the zip. The text lives in a real UTF-8 file
          # in the repo, and is re-encoded to UTF-8-with-BOM here so Windows Notepad
          # always renders the Chinese correctly.
          # Do NOT build this text from a PowerShell string literal: non-ASCII in an
          # inline run: block breaks under Windows PowerShell 5.1 (see note at top).
          $readmeSrc  = "$env:GITHUB_WORKSPACE\installer\README-portable.txt"
          $readmeText = [System.IO.File]::ReadAllText($readmeSrc, [System.Text.Encoding]::UTF8)
          [System.IO.File]::WriteAllText("$portableDir\README.txt", $readmeText, (New-Object System.Text.UTF8Encoding($true)))

          Compress-Archive -Path "$portableDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\GameLibrary-portable-win-x64.zip" -Force
          Write-Host "Portable payload contents:"
          Get-ChildItem $portableDir | ForEach-Object { Write-Host "  $($_.Name)" }

      # setup.exe 直接打包同一份【自包含】产物，因此安装后即可运行、无需再装运行时。
      - name: Build installer (setup.exe)
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress --allow-downgrade
          }
          $isccDir = @("C:\Program Files (x86)\Inno Setup 6", "C:\Program Files\Inno Setup 6") | Where-Object { Test-Path "$_\ISCC.exe" } | Select-Object -First 1
          if (-not $isccDir) { throw "ISCC.exe not found after install" }
          & "$isccDir\ISCC.exe" "installer\GameLibrary.iss" /DMySourceDir="$env:GITHUB_WORKSPACE\src\GameLibrary\x64\Release\GameLibrary" /DMyOutputDir="$env:GITHUB_WORKSPACE\installer-output" /DMyAppVersion="1.0.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup packaging failed, exit code $LASTEXITCODE" }

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-setup-win-x64
          path: installer-output/GameLibrary-Setup-x64.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-portable-win-x64
          path: GameLibrary-portable-win-x64.zip
          if-no-files-found: error

      - name: Upload sideload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-MSIX-x64
          path: AppPackages/**
          if-no-files-found: error

      - name: Upload store bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-store-msixbundle
          path: StorePackages/**
          if-no-files-found: error

      - name: Upload generated files (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: src/GameLibrary/Generated Files/**
          if-no-files-found: ignore
