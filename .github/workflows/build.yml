name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap vcpkg
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg dependencies
        shell: powershell
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE"

      - name: Restore NuGet packages
        shell: powershell
        run: |
          msbuild GameLibrary.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      # 1) Sideload MSIX (self-signed; for manual sideload install)
      #    与 main 一致保持框架依赖(WindowsAppSDKSelfContained=false)：
      #    自包含(true)在 WinAppSDK 1.6/1.7 下都可能出现引导库链接问题，且 MSIX
      #    仍需 VCLibs 框架；这里统一用框架依赖，干净机器改用便携版(已内置 VC++ 运行库)。
      #    （崩溃修复已在源码中；目标机器安装过 VS/WinAppSDK 运行库即可正常启动）
      - name: Build sideload MSIX
        shell: powershell
        run: |
          msbuild src\GameLibrary.Package\GameLibrary.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:WindowsAppSDKSelfContained=false "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages" /m

      # 2) Store bundle (unsigned .msixbundle for Microsoft Partner Center; Store re-signs it)
      - name: Build store bundle
        shell: powershell
        run: |
          msbuild src\GameLibrary.Package\GameLibrary.Package.wapproj /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Always /p:WindowsAppSDKSelfContained= /p:AppxPackageSigningEnabled=false "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\StorePackages" /m

      # 3) 便携版（框架依赖；运行时随 WinAppSDK 框架包，目标机安装过框架即可运行）
      - name: Build portable (framework-dependent)
        shell: powershell
        run: |
          msbuild src\GameLibrary\GameLibrary.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VcpkgRoot=$env:VCPKG_ROOT /p:WindowsAppSDKSelfContained=false /t:Rebuild /m

      # 基础代码加固：用 UPX 对自包含 exe 加壳（压缩 + 简单反静态分析）。
      # 这是最低成本的防护；如需强防护（Anti-Debug / 虚拟化 / 反 dump），
      # 请自备 VMProtect 或 Themida 的许可证，在本步骤替换为对应命令行调用。
      - name: Protect binaries (UPX)
        shell: powershell
        run: |
          choco install upx -y --no-progress
          $exe = "$env:GITHUB_WORKSPACE\src\GameLibrary\x64\Release\GameLibrary\GameLibrary.exe"
          if (Test-Path $exe) { upx --best --lzma "$exe" } else { Write-Host "GameLibrary.exe not found, skipping UPX" }

      - name: Zip portable
        shell: powershell
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\src\GameLibrary\x64\Release\GameLibrary\*" -DestinationPath "$env:GITHUB_WORKSPACE\GameLibrary-portable-win-x64.zip" -Force

      - name: Stage WinAppSDK runtime installer (for clean-machine setup)
        shell: powershell
        run: |
          # WinAppSDK 1.7 运行时安装包（随 setup.exe 一起分发，安装时静默安装框架依赖）
          $url = "https://aka.ms/windowsappsdk/1.7/4/windowsappruntimeinstall.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:GITHUB_WORKSPACE\installer\WinAppRuntimeInstall.exe" -ErrorAction Stop

      - name: Build installer (setup.exe)
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress --allow-downgrade
          }
          $isccDir = @("C:\Program Files (x86)\Inno Setup 6", "C:\Program Files\Inno Setup 6") | Where-Object { Test-Path "$_\ISCC.exe" } | Select-Object -First 1
          if (-not $isccDir) { throw "ISCC.exe not found after install" }
          & "$isccDir\ISCC.exe" "installer\GameLibrary.iss" /DMySourceDir="$env:GITHUB_WORKSPACE\src\GameLibrary\x64\Release\GameLibrary" /DMyOutputDir="$env:GITHUB_WORKSPACE\installer-output" /DMyAppVersion="1.0.0.0"

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-setup-win-x64
          path: installer-output/GameLibrary-Setup-x64.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-portable-win-x64
          path: GameLibrary-portable-win-x64.zip
          if-no-files-found: error

      - name: Upload sideload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-MSIX-x64
          path: AppPackages/**
          if-no-files-found: error

      - name: Upload store bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-store-msixbundle
          path: StorePackages/**
          if-no-files-found: error

      - name: Upload generated files (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: src/GameLibrary/Generated Files/**
          if-no-files-found: ignore
